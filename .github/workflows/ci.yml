name: CI

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
    branches:
      - main
      - "release/**"
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUST_BACKTRACE: "1"

jobs:
  fmt:
    name: Format & Packaging Audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: rustfmt
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Verify workspace manifests, attribution, and CI/CD workflows
        run: python3 scripts/ci_verify_packaging.py --check-workflows

  lint:
    name: Clippy (All Targets)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run Clippy with warnings denied
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run workspace unit & integration tests
        run: cargo test --locked --workspace

  windows:
    name: Check & Build (Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-x64
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Lint workspace on Windows
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Build tekvra binary on Windows
        run: cargo build --locked --bin tekvra

  deny:
    name: Dependency & License Policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Enforce Apache-2.0 permissive policy & crate bans
        run: cargo deny --locked check advisories licenses bans sources

  ci-gate:
    name: CI
    if: always()
    needs:
      - fmt
      - lint
      - test
      - windows
      - deny
    runs-on: ubuntu-24.04
    steps:
      - name: Verify all CI jobs succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: CI gate passed
        run: echo "All Tekvra CI checks succeeded."
