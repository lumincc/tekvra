[workspace]
resolver = "3"
members = [
  "crates/tekvra-protocol",
  "crates/tekvra-config",
  "crates/tekvra-providers",
  "crates/tekvra-storage",
  "crates/tekvra-tools",
  "crates/tekvra-core",
  "crates/tekvra-tui",
  "crates/tekvra-lua",
  "crates/tekvra-app-server",
  "crates/tekvra-acp",
  "crates/tekvra-cli",
]
exclude = [".tmp"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Tekvra Contributors"]
repository = "https://github.com/tekvra/tekvra"
rust-version = "1.99"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"

[workspace.dependencies]
tekvra-protocol = { version = "0.1.0", path = "crates/tekvra-protocol" }
tekvra-config = { version = "0.1.0", path = "crates/tekvra-config" }
tekvra-storage = { version = "0.1.0", path = "crates/tekvra-storage" }
tekvra-providers = { version = "0.1.0", path = "crates/tekvra-providers" }
tekvra-tools = { version = "0.1.0", path = "crates/tekvra-tools" }
tekvra-lua = { version = "0.1.0", path = "crates/tekvra-lua" }
tekvra-core = { version = "0.1.0", path = "crates/tekvra-core" }
tekvra-tui = { version = "0.1.0", path = "crates/tekvra-tui" }
tekvra-app-server = { version = "0.1.0", path = "crates/tekvra-app-server" }
tekvra-acp = { version = "0.1.0", path = "crates/tekvra-acp" }

anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws", "json"] }
base64 = "0.23"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["event-stream"] }
dotenvy = "0.15"
futures = "0.3"
globset = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
http = "1"
ignore = "0.4"
indexmap = { version = "2", features = ["serde"] }
jiff = { version = "1", default-features = false, features = ["std"] }
jsonschema = { version = "0.63", default-features = false }
mlua = { version = "0.12", features = ["luau", "luau-jit", "async", "send", "serde"] }
monty = "1"
monty-types = "1"
ipnet = "2"
portable-pty = "0.9"
pulldown-cmark = "0.13"
ratatui = "0.30"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
rusqlite = { version = "0.43", features = ["bundled"] }
semver = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.11"
shell-words = "1"
similar = { version = "3", features = ["inline", "unicode"] }
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "net", "io-util", "io-std", "signal", "fs"] }
tokio-tungstenite = "0.30"
tokio-util = { version = "0.7", features = ["codec", "io", "rt"] }
toml = "1"
toml_edit = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "env-filter", "json"] }
tree-sitter = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-go = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
unicode-width = "0.2"
url = "2"
uuid = { version = "1", default-features = false, features = ["std", "v7", "v4", "serde"] }

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false

[profile.release]
lto = "thin"

[profile.release-lto]
inherits = "release"
lto = "fat"
codegen-units = 1
